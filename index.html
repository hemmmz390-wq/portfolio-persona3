<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elbert Alwi | Portfolio</title>
  <meta name="description" content="Portfolio Elbert Alwi — Web Developer, Photographer, Content Creator. Bergaya pause menu Persona 3 Reload.">
  <meta name="theme-color" content="#001233">
  <link rel="canonical" href="https://elbert-persona.vercel.app/">
  <!-- Pratinjau saat link dibagikan (WhatsApp, IG, X, LinkedIn, Discord) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://elbert-persona.vercel.app/">
  <meta property="og:site_name" content="Elbert Alwi">
  <meta property="og:title" content="Elbert Alwi | Portfolio">
  <meta property="og:description" content="Web Developer, Photographer, Content Creator. Portfolio bergaya pause menu Persona.">
  <meta property="og:image" content="https://elbert-persona.vercel.app/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Elbert Alwi dalam gaya layar Persona 5">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Elbert Alwi | Portfolio">
  <meta name="twitter:description" content="Web Developer, Photographer, Content Creator. Portfolio bergaya pause menu Persona.">
  <meta name="twitter:image" content="https://elbert-persona.vercel.app/assets/og.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,800;1,700;1,800;1,900&family=Poppins:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/hero.webp">
  <link rel="stylesheet" href="css/style.css?v=43">
</head>
<body>
  <!-- Latar laut: gradien + sinar cahaya + gelembung (diisi JS) -->
  <div class="ocean" aria-hidden="true">
    <div class="ocean-surface">
      <svg viewBox="0 0 1600 420" preserveAspectRatio="xMidYMin slice">
        <filter id="caustic" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".0045 .028" numOctaves="2" seed="7"/>
          <feColorMatrix type="matrix" values="0 0 0 0 .78  0 0 0 0 .96  0 0 0 0 1  22 0 0 0 -11.6"/>
        </filter>
        <rect width="200%" height="100%" filter="url(#caustic)"/>
      </svg>
    </div>
    <div class="ocean-rays"></div>
    <div class="ocean-caustics"></div>
    <div class="vignette"></div>
  </div>

  <!-- Loading -->
  <section id="loading" class="loading" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="loading-hud">
      <h2 class="loading-title">NOW LOADING<span class="dots"><i>.</i><i>.</i><i>.</i></span></h2>
      <div class="loading-track"><div class="loading-fill" id="loading-fill"></div></div>
      <span class="loading-percent" id="loading-percent">0%</span>
    </div>
    <button class="press-start" id="press-start" hidden>PRESS ANY KEY</button>
  </section>

  <!-- Menu utama -->
  <main id="menu" class="menu-screen" aria-label="Menu utama">
    <div class="hero-bg" id="hero-bg" aria-hidden="true"></div>
    <div class="side-number" id="side-number" aria-hidden="true">01</div>
    <div class="character" id="character" aria-hidden="true"></div>

    <header class="profile-header">
      <span class="profile-name" data-bind="name"></span>
      <span class="profile-line"></span>
      <span class="profile-role" data-bind="role"></span>
    </header>

    <nav class="menu-column" id="menu-column">
      <ul class="menu-list" id="menu-list" role="menu"></ul>
    </nav>

    <p class="menu-desc" id="menu-desc"></p>

    <div class="hud">
      <span class="key">↑↓</span><span>Pilih</span>
      <span class="key">ENTER</span><span>Konfirmasi</span>
      <button class="sound-toggle" id="sound-toggle" aria-pressed="true"><span class="key">M</span><span id="sound-label">Suara: ON</span></button>
    </div>
  </main>

  <!-- PROJECT -->
  <section id="screen-project" class="screen" aria-hidden="true">
    <div class="screen-name" data-bind="name"></div>
    <div class="banner"><div class="shard sh-a"></div><div class="shard sh-b"></div><div class="shard sh-c"></div><h1>PROJECT</h1></div>
    <div class="project-layout">
      <ul class="project-list" id="project-list" role="tablist"></ul>
      <article class="project-detail" id="project-detail" aria-live="polite"></article>
    </div>
    <div class="hud hud-bottom">
      <span class="key">↑↓</span><span>Pilih</span>
      <span class="key">ENTER</span><span>Buka</span>
      <button class="key key-btn" data-back>ESC</button><span>Kembali</span>
    </div>
  </section>

  <!-- SKILLS -->
  <section id="screen-skills" class="screen" aria-hidden="true">
    <div class="screen-name" data-bind="name"></div>
    <div class="banner banner-alt"><div class="shard sh-a"></div><div class="shard sh-b"></div><div class="shard sh-c"></div><h1>SKILLS</h1></div>
    <nav class="skill-tabs" id="skill-tabs" role="tablist"></nav>
    <div class="skill-grid" id="skill-grid"></div>
    <div class="hud hud-bottom">
      <button class="key key-btn" id="tab-prev">Q</button><span>Prev</span>
      <button class="key key-btn" id="tab-next">E</button><span>Next</span>
      <button class="key key-btn" data-back>ESC</button><span>Kembali</span>
    </div>
  </section>

  <!-- ABOUT -->
  <section id="screen-about" class="screen" aria-hidden="true">
    <div class="banner"><div class="shard sh-a"></div><div class="shard sh-b"></div><div class="shard sh-c"></div><h1>ABOUT</h1></div>
    <div class="about-card">
      <div class="about-top">
        <div class="photo" id="photo"></div>
        <div>
          <h2 class="about-name" data-bind="name"></h2>
          <p class="about-role" data-bind="role"></p>
          <dl class="about-stats" id="about-stats"></dl>
        </div>
      </div>
      <div class="about-bio" id="about-bio"></div>
      <figure class="about-quote">
        <blockquote id="quote-text"></blockquote>
        <figcaption id="quote-author"></figcaption>
      </figure>
    </div>
    <div class="hud hud-bottom">
      <button class="key key-btn" data-back>ESC</button><span>Kembali</span>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="screen-contact" class="screen" aria-hidden="true">
    <div class="phone">
      <div class="phone-body">
        <div class="phone-top"><span>MAIL</span><span class="phone-clock" id="phone-clock"></span></div>
        <div class="phone-watermark" aria-hidden="true">MAIL</div>
        <ul class="mail-list" id="mail-list"></ul>
      </div>
    </div>
    <div class="hud hud-bottom">
      <span class="key">↑↓</span><span>Pilih</span>
      <span class="key">ENTER</span><span>Buka</span>
      <button class="key key-btn" data-back>ESC</button><span>Kembali</span>
    </div>
  </section>

  <!-- PHOTOGRAPHY: menu pertarungan ala Persona 5 -->
  <section id="screen-photography" class="screen photo-screen" aria-hidden="true" aria-labelledby="pm-title">
    <h1 class="pm-title" id="pm-title"><span>PHOTO</span>GRAPHY</h1>
    <div class="pm-stage">
      <div class="pm-art" id="pm-art">
        <div class="pm-visual" aria-hidden="true">
          <div class="pm-bg"></div>
          <svg class="pm-burst" viewBox="0 0 100 100" preserveAspectRatio="none">
            <polygon points="50,0 57,24 80,6 68,30 100,26 72,42 96,58 66,54 74,84 54,62 50,100 46,62 26,84 34,54 4,58 28,42 0,26 32,30 20,6 43,24" />
          </svg>
          <div class="pm-person" id="pm-person"></div>
        </div>
        <nav class="pm-menu" id="pm-menu" aria-label="Kategori fotografi"></nav>
      </div>
      <p class="pm-hint-bar" id="pm-hint-bar" aria-live="polite"></p>
    </div>
    <div class="hud hud-bottom">
      <span class="key">↑↓</span><span>Pilih</span>
      <span class="key">ENTER</span><span>Buka</span>
      <button class="key key-btn" data-back>ESC</button><span>Kembali</span>
    </div>
  </section>

  <!-- Galeri (di atas layar PHOTOGRAPHY) -->
  <div class="gallery" id="gallery" role="dialog" aria-modal="true" aria-labelledby="gallery-title" hidden>
    <header class="gallery-head">
      <span class="gallery-tag" id="gallery-tag"></span>
      <h2 class="gallery-title" id="gallery-title"></h2>
      <span class="gallery-count" id="gallery-count"></span>
      <button class="gallery-close" id="gallery-close" aria-label="Tutup galeri"><span class="key">ESC</span> Tutup</button>
    </header>
    <div class="gallery-body" id="gallery-body"></div>
  </div>

  <!-- Lightbox foto -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-title" hidden>
    <figure class="lb-figure">
      <img class="lb-img" id="lb-img" alt="">
      <figcaption class="lb-caption">
        <span class="lb-counter" id="lb-counter"></span>
        <strong class="lb-title" id="lb-title"></strong>
        <span class="lb-meta" id="lb-meta"></span>
      </figcaption>
    </figure>
    <button class="lb-nav lb-prev" id="lb-prev" aria-label="Foto sebelumnya">‹</button>
    <button class="lb-nav lb-next" id="lb-next" aria-label="Foto berikutnya">›</button>
    <button class="lb-close" id="lb-close" aria-label="Tutup foto"><span class="key">ESC</span></button>
  </div>

  <!-- Transisi sapuan diagonal -->
  <div class="wipe" id="wipe" aria-hidden="true"><div class="wipe-a"></div><div class="wipe-b"></div><div class="wipe-c"></div></div>

  <script src="js/data.js?v=43"></script>
  <script src="js/main.js?v=43"></script>
</body>
</html>
